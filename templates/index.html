<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETS Route Plotter</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 600px; }
        body { padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">Edmonton Transit System Route Plotter</h1>
        <div class="row">
            <div class="col-md-4">
                <h3>Plot a Route</h3>
                <div class="input-group mb-3">
                    <input type="text" class="form-control" id="routeInput" placeholder="Enter Route ID">
                    <button class="btn btn-primary" type="button" id="plotButton">Plot Route</button>
                </div>
                <div id="error-message" class="text-danger"></div>
            </div>
            <div class="col-md-8">
                <div id="map"></div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Initialize the map centered on Edmonton
        var map = L.map('map').setView([53.5461, -113.4938], 11);
        var routeLayer = L.layerGroup().addTo(map);

        // Add a tile layer from OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        document.getElementById('plotButton').addEventListener('click', function() {
            var routeId = document.getElementById('routeInput').value;
            var errorMessage = document.getElementById('error-message');
            errorMessage.textContent = ''; // Clear previous errors

            if (!routeId) {
                errorMessage.textContent = 'Please enter a Route ID.';
                return;
            }

            // Fetch route data from the Flask API
            fetch('/api/route/' + routeId)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Route not found.');
                    }
                    return response.json();
                })
                .then(data => {
                    // Clear previous route from the map
                    routeLayer.clearLayers();

                    if (data.length > 0) {
                        var latlngs = data.map(point => [point[0], point[1]]);
                        var polyline = L.polyline(latlngs, {color: 'red'}).addTo(routeLayer);

                        // Zoom the map to the route
                        map.fitBounds(polyline.getBounds());
                    } else {
                        errorMessage.textContent = 'No coordinate data for this route.';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    errorMessage.textContent = 'Error: ' + error.message;
                });
        });
    </script>
</body>
</html>
